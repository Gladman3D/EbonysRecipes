<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lily & Loam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1EADA;
    --cream-deep:#E7DEC8;
    --card:#FBF8EF;
    --ink:#332D1F;
    --ink-soft:#746A54;
    --moss:#6E7B4F;
    --moss-dark:#4C5834;
    --moss-pale:#DCE3C7;
    --plum:#93415B;
    --plum-dark:#6C2C42;
    --plum-pale:#EFDDE2;
    --gold:#C69A2E;
    --line:#DED0AC;
    --shadow: 0 1px 2px rgba(51,45,31,0.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(110,123,79,0.07), transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(147,65,91,0.06), transparent 42%);
